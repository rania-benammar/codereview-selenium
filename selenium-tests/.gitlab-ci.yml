stages:
  - test

variables:
  CHROME_DRIVER_VERSION: "latest"
  SCREENSHOTS_DIR: "screenshots"
  NODE_ENV: "test"

selenium-tests:
  stage: test
  image: node:20-bullseye

  before_script:
    # Install Chrome + ChromeDriver
    - apt-get update -qq
    - apt-get install -y -qq \
        wget \
        curl \
        unzip \
        gnupg \
        ca-certificates \
        fonts-liberation \
        libasound2 \
        libatk-bridge2.0-0 \
        libatk1.0-0 \
        libatspi2.0-0 \
        libcups2 \
        libdbus-1-3 \
        libdrm2 \
        libgbm1 \
        libgtk-3-0 \
        libnspr4 \
        libnss3 \
        libx11-xcb1 \
        libxcb-dri3-0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxkbcommon0 \
        libxrandr2 \
        xdg-utils \
        libgconf-2-4 \
        libxi6 \
        libxss1 \
        maven

    # Install Google Chrome stable
    - wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update -qq
    - apt-get install -y -qq google-chrome-stable

    # Install ChromeDriver matching installed Chrome version
    - CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
    - echo "Detected Chrome major version $CHROME_VERSION"
    - CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/$(curl -s https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_VERSION})/linux64/chromedriver-linux64.zip"
    - wget -q "$CHROMEDRIVER_URL" -O chromedriver.zip
    - unzip -q chromedriver.zip
    - mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
    - chmod +x /usr/local/bin/chromedriver
    - chromedriver --version

    # Install Node dependencies
    - npm ci

    # Create screenshots output directory
    - mkdir -p $SCREENSHOTS_DIR

  script:
    - npm test

  after_script:
    # List captured screenshots for visibility in job log
    - echo "=== Captured screenshots ==="
    - ls -lh $SCREENSHOTS_DIR || echo "No screenshots found"

  artifacts:
    name: "selenium-screenshots-$CI_COMMIT_SHORT_SHA"
    when: always   # Collect even on failure (useful for debugging)
    expire_in: 7 days
    paths:
      - $SCREENSHOTS_DIR/
    reports:
      junit: test-results.xml   # Remove if you don't generate JUnit XML

  # Optional: cache node_modules between pipelines
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

  # Run only on MRs and main/develop branches
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'