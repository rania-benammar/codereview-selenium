stages:
  - test

variables:
  SCREENSHOTS_DIR: "selenium-tests/screenshots"
  SELENIUM_URL: "http://chrome-server:4444/wd/hub"

selenium-tests:
  stage: test

  image: maven:3.9.6-eclipse-temurin-21

  services:
    - name: selenium/standalone-chrome:latest
      alias: chrome-server

  script:
    - echo "Selenium URL : $SELENIUM_URL"
    - cd selenium-tests
    - mkdir -p screenshots
    - mvn clean test -DSELENIUM_URL=$SELENIUM_URL

  artifacts:
    when: always
    paths:
      - selenium-tests/target/surefire-reports/
      - selenium-tests/screenshots/
    reports:
      junit:
        - selenium-tests/target/surefire-reports/TEST-*.xml